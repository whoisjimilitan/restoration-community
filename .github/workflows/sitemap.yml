name: Daily sitemap
on:
  schedule:
    - cron: "10 5 * * *"   # 05:10 UTC = 5:10 a.m. Accra, just after each letter goes live
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brotherjimi-live
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python engine/sitemap.py
      - name: Commit if changed
        run: |
          if ! git diff --quiet site/sitemap.xml; then
            git config user.name "sitemap-bot"
            git config user.email "sitemap-bot@users.noreply.github.com"
            git add site/sitemap.xml
            git commit -m "Daily sitemap: add this morning's letter"
            git push
          fi
