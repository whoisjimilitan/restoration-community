<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Records · Brother Jimi</title>
<meta name="description" content="Past Encounters: documented gatherings where people encountered Jesus through the message of Brother Jimi.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Brother Jimi">
<meta property="og:title" content="Records">
<meta property="og:description" content="Past Encounters: documented gatherings where people encountered Jesus.">
<meta property="og:url" content="https://brotherjimi.com/records">
<meta property="og:image" content="https://brotherjimi.com/images/og.jpg">
<meta name="theme-color" content="#fbfaf7">
<link rel="icon" href="/images/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<link rel="preload" href="/assets/fonts/albert-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
html, body { background: #fbfaf7; color: #15120f; font: 400 17px/1.6 "Albert Sans", system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; padding: 0; }
header { padding: 20px; border-bottom: 1px solid #e4dfd6; }
.nav { display: flex; align-items: center; gap: 24px; max-width: 600px; margin: 0 auto; }
.nav a { color: #857d71; text-decoration: none; font: 600 11px/1 "Albert Sans"; letter-spacing: .24em; text-transform: uppercase; padding: 10px 0; }
.nav a:hover { color: #15120f; }
.nav .on { color: #15120f; border-bottom: 2px solid #8b2332; }
main { max-width: 600px; margin: 0 auto; padding: 48px 20px; }
h1 { margin: 0 0 8px; font: 300 56px/1.04 "Albert Sans"; letter-spacing: -.025em; }
.desc { margin: 0 0 36px; color: #857d71; font-size: 16px; }
.records { display: grid; gap: 24px; }
.record { border: 1px solid #e4dfd6; border-radius: 4px; overflow: hidden; transition: border-color .2s; }
.record:hover { border-color: #8b2332; }
.record-img { display: block; width: 100%; height: 200px; object-fit: cover; background: #f2efe9; }
.record-content { padding: 20px; }
.record-title { margin: 0 0 4px; font: 500 20px/1.2 "Albert Sans"; }
.record-date { margin: 0 0 12px; color: #857d71; font-size: 14px; }
.record-link { display: inline-flex; align-items: center; gap: 8px; color: #8b2332; text-decoration: none; font: 600 14px/1 "Albert Sans"; letter-spacing: .02em; }
.record-link:hover { text-decoration: underline; }
footer { border-top: 1px solid #e4dfd6; padding: 36px 20px; text-align: center; color: #857d71; font-size: 14px; }
@media (min-width: 720px) {
  main { padding: 64px 32px; }
  .records { grid-template-columns: repeat(2, 1fr); gap: 32px; }
}
</style>
</head>
<body>

<header>
  <nav class="nav">
    <a href="/">Home</a>
    <a href="/today">Today</a>
    <a href="/accra">Accra</a>
    <a href="/records" class="on">Records</a>
  </nav>
</header>

<main>
  <h1>Records</h1>
  <p class="desc">Past encounters: documented gatherings where people experienced Jesus in the power of the Holy Spirit.</p>

  <div class="records" data-records>
    <!-- Records populate here -->
  </div>

  <div style="text-align: center; margin-top: 48px; color: #857d71; font-size: 15px;">
    <p>When a gathering is finished, its story lives here—photos, videos, testimonies of what happened.</p>
  </div>
</main>

<footer>
  <p>&copy; <span id="yr">2026</span> Brother Jimi, a servant of Jesus Christ</p>
</footer>

<script>
// Records will populate from JSON config (future implementation)
// For now, Accra is the active event, so records will show past cities as they're completed
(function(){
  var recordsContainer = document.querySelector('[data-records]');

  // Template for past events - will be populated as events complete
  var pastEvents = [
    // {
    //   city: "Lagos",
    //   date: "14 January 2027",
    //   url: "/records/lagos",
    //   image: "/images/records/lagos-hero.jpg"
    // }
  ];

  if (pastEvents.length === 0) {
    recordsContainer.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #857d71; padding: 48px 20px;">Check back after the first gathering.</p>';
    return;
  }

  pastEvents.forEach(function(event){
    var html = '<div class="record">' +
      '<img class="record-img" src="' + event.image + '" alt="' + event.city + ' Encounters Christ">' +
      '<div class="record-content">' +
        '<h3 class="record-title">' + event.city + ' Encounters Christ</h3>' +
        '<p class="record-date">' + event.date + '</p>' +
        '<a class="record-link" href="' + event.url + '">See what happened →</a>' +
      '</div>' +
    '</div>';
    recordsContainer.insertAdjacentHTML('beforeend', html);
  });
})();

// Update year in footer
document.getElementById('yr').textContent = new Date().getFullYear();
</script>
</body>
</html>
