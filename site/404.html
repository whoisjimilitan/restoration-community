<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Not found · Brother Jimi</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0a09">
<link rel="icon" href="/images/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<link rel="preload" href="/assets/fonts/albert-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Albert Sans";src:url(/assets/fonts/albert-sans-latin-wght-normal.woff2) format("woff2");font-weight:100 900;font-display:swap}
/* Not found, built to DESIGN-RULES.md: the film's night, one sentence, one way home. */
:root{
  --night:#0b0a09; --bone:#ece5d8; --soft:#c9c0b1; --dim:#8f8678;
  --sans:"Albert Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --gut:20px; color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--night);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100svh;display:flex;flex-direction:column;background:var(--night);color:var(--bone);font:400 17px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--bone);outline-offset:4px;border-radius:2px}
p{margin:0}
.wrap{width:100%;max-width:600px;margin:0 auto;padding-left:max(var(--gut),env(safe-area-inset-left));padding-right:max(var(--gut),env(safe-area-inset-right))}
main{flex:1;display:flex;align-items:center}
main .wrap{padding-top:calc(56px + env(safe-area-inset-top));padding-bottom:56px}
h1{margin:0;font:300 clamp(40px,11vw,64px)/1.02 var(--sans);letter-spacing:-.02em;max-width:9em;text-wrap:balance}
.home{display:inline-flex;align-items:center;gap:10px;margin-top:32px;padding:12px 0;font:600 16px/1 var(--sans);text-decoration:none;border-bottom:1px solid rgba(236,229,216,.3)}
.home:hover{border-color:var(--bone)}
.home svg{width:16px;height:16px}
.foot{display:flex;flex-direction:row;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:10px 24px;padding-top:32px;padding-bottom:calc(40px + env(safe-area-inset-bottom));font-size:14px;line-height:1.6;color:var(--dim)}
.foot a{text-decoration:none}
.foot a:hover{color:var(--bone)}
.foot nav{display:flex;gap:22px}
@media (min-width:720px){:root{--gut:32px}.foot{flex-direction:row;justify-content:space-between;align-items:center}}
.foot .back svg{display:inline-block;width:15px;height:15px;margin-right:8px;vertical-align:-2px}
</style>
</head>
<body>
<main>
  <div class="wrap">
    <h1>This page is not here.</h1>
    <a class="home" href="/" data-next><span>Go to the homepage</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
  </div>
</main>
<footer>
  <div class="wrap foot"><p><a class="back" href="/"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H6M11 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Brother Jimi</a></p><nav aria-label="More"><a href="/counsel">Today&rsquo;s Letter</a></nav></div>
</footer>
<script src="/assets/cities.js"></script>
<script>
/* Someone lost here is most often looking for the next City Encounter. Until it has ended, the way out is that city;
   after it, the homepage. The footer already offers the homepage and today's letter. */
(function(){ var a=document.querySelector('[data-next]'), now=Date.now();
  var c=(window.CITIES||[]).filter(function(x){ return Date.parse(x.eventEnds)>now; })[0];
  if(a&&c){ a.href='/'+c.slug; a.firstChild.textContent=c.title; } })();
</script>
</body>
</html>
