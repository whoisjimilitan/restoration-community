<!doctype html>
<!-- Status video captions: Jimi's exact spoken words, a few at a time. 576x1024, rendered as a transparent PNG
     once per caption (replace only {{text}}, HTML-escaped), each laid over the video for exactly the time those words are spoken.
     Sits above the name tag. Locked: change nothing. --><html><head><meta charset="utf-8"><style>
@font-face{font-family:I;font-weight:100 900;src:url("../assets/fonts/inter-latin-wght-normal.woff2")}
html,body{margin:0;width:576px;height:1024px;background:transparent;font-family:I,sans-serif}
.cap{position:absolute;left:40px;right:40px;bottom:150px;display:flex;justify-content:center}
.cap p{margin:0;max-width:470px;text-align:center;color:#fff;font-size:36px;line-height:1.16;font-weight:800;letter-spacing:-.02em;
  text-wrap:balance;text-shadow:0 2px 3px rgba(0,0,0,.55),0 0 22px rgba(0,0,0,.45),0 0 2px rgba(0,0,0,.6)}
</style></head><body><div class="cap"><p>{{text}}</p></div></body></html>
