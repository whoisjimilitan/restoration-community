<style>
html{background:#0b0a09;scroll-behavior:smooth}
body.tr{
  --ink:#f3efe7;--slate:#a39c93;--quiet:#7a746c;
  --white:#141311;--field:#3a3630;--hair:#3a3630;
  background:#0b0a09;color:var(--ink);font-family:var(--sans);margin:0;
}
.tr-nav{
  position:fixed;top:0;left:0;right:0;z-index:40;
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px;background:linear-gradient(#0b0a09ee,#0b0a0900);
}
.tr-brand{
  color:var(--ink);text-decoration:none;font-size:14px;font-weight:600;
  letter-spacing:.04em;text-transform:uppercase;opacity:.9;
}
.tr-brand:hover{text-decoration:none;opacity:1}
.tr-main{max-width:920px;margin:0 auto;padding:0 20px 80px}
.tr-kicker{
  font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--quiet);margin:0 0 16px;font-weight:600;
}
.tr-h{
  font-size:clamp(36px,9vw,72px);font-weight:700;letter-spacing:-0.035em;
  line-height:1.02;color:var(--ink);margin:0;
}
.tr-sub{
  font-size:clamp(17px,2.4vw,22px);line-height:1.5;color:var(--slate);
  max-width:34ch;margin:18px 0 0;
}
.tr-frame{
  position:relative;width:100%;min-height:min(78vh,640px);
  border-radius:4px;overflow:hidden;
  background:
    radial-gradient(120% 80% at 20% 20%, rgba(139,35,50,.22), transparent 55%),
    radial-gradient(90% 70% at 80% 70%, rgba(80,70,50,.35), transparent 50%),
    linear-gradient(165deg,#1a1714 0%,#0e0d0c 45%,#14100e 100%);
  display:flex;align-items:flex-end;margin:0;
}
.tr-frame::after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.14;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  mix-blend-mode:overlay;
}
.tr-frame-tag{
  position:absolute;top:18px;left:18px;z-index:2;
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:rgba(243,239,231,.55);font-weight:600;
  border:1px solid rgba(243,239,231,.18);
  padding:6px 10px;border-radius:999px;
  background:rgba(11,10,9,.35);backdrop-filter:blur(6px);
}
.tr-frame-cap{
  position:relative;z-index:2;padding:28px 24px 32px;width:100%;
  background:linear-gradient(transparent,rgba(11,10,9,.88));
}
.tr-hero-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px;align-items:center}
.tr-btn{
  display:inline-flex;align-items:center;justify-content:center;
  min-height:48px;padding:12px 22px;border-radius:980px;
  font:inherit;font-size:15px;font-weight:600;letter-spacing:-0.01em;
  text-decoration:none;cursor:pointer;border:0;
  background:var(--wine);color:#fff;
}
.tr-btn:hover{background:var(--wine-hover);text-decoration:none}
.tr-btn-ghost{background:transparent;color:var(--ink);border:1px solid rgba(243,239,231,.28)}
.tr-btn-ghost:hover{background:rgba(243,239,231,.06);border-color:rgba(243,239,231,.45)}
.tr-note{font-size:13px;color:var(--quiet);margin:14px 0 0;max-width:42ch}
.tr-sec{padding:96px 0 0}

.tr-lines{max-width:540px}
.tr-line{
  font-family:var(--word);font-style:italic;
  font-size:clamp(22px,4vw,30px);line-height:1.4;color:var(--ink);
  margin:0 0 28px;
}
.tr-line span{
  display:block;font-family:var(--sans);font-style:normal;
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;

}
