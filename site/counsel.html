/* /counsel always opens today's letter, at its own permanent address */
(function(){ var t=window.todaysLetter&&window.todaysLetter(); if(t) location.replace('/counsel/'+t.slug); })();
</script>
<style>
@font-face{font-family:"Albert Sans";src:url(/assets/fonts/albert-sans-latin-wght-normal.woff2) format("woff2");font-weight:100 900;font-display:swap}
/* Counsel: seen only for a moment, or without JavaScript. The film's night, and the letters so far. */
:root{--night:#0b0a09;--bone:#ece5d8;--soft:#c9c0b1;--dim:#8f8678;--sans:"Albert Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--gut:20px;color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--night)}
body{margin:0;min-height:100svh;display:flex;flex-direction:column;background:var(--night);color:var(--bone);font:400 17px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
p{margin:0}
.wrap{width:100%;max-width:600px;margin:0 auto;padding-left:max(var(--gut),env(safe-area-inset-left));padding-right:max(var(--gut),env(safe-area-inset-right))}
main{flex:1}
main .wrap{padding-top:calc(56px + env(safe-area-inset-top));padding-bottom:56px}
.kicker{font:500 12px/1 var(--sans);letter-spacing:.32em;text-transform:uppercase;color:var(--soft)}
h1{margin:18px 0 0;font:300 clamp(40px,11vw,64px)/1.02 var(--sans);letter-spacing:-.02em}
ol{list-style:none;margin:32px 0 0;padding:0;display:flex;flex-direction:column;gap:14px}
ol a{font:400 21px/1.3 var(--sans);text-decoration:none;border-bottom:1px solid rgba(236,229,216,.3)}
ol a:hover{border-color:var(--bone)}
ol span{display:block;margin-top:2px;font-size:14px;color:var(--dim)}
.foot{display:flex;flex-direction:row;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:10px 24px;padding-top:32px;padding-bottom:calc(40px + env(safe-area-inset-bottom));font-size:14px;color:var(--dim)}
.foot a{text-decoration:none}
.foot nav{display:flex;gap:22px}
@media (min-width:720px){:root{--gut:32px}.foot{flex-direction:row;justify-content:space-between}}
</style>
</head>
<body>
<main>
  <div class="wrap">
    <p class="kicker">Every morning</p>
    <h1>Counsel</h1>
    <ol>
      <li><a href="/counsel/value-in-challenges">There is value in challenges</a><span>21 November 2026</span></li>
    </ol>
  </div>
</main>
<footer>
  <div class="wrap foot"><p><a href="/">Home</a></p><nav aria-label="More"><a href="/privacy">Privacy</a></nav></div>
</footer>
</body>
</html>
